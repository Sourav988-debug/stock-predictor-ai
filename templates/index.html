<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Price Prediction</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Stock Price Prediction</h1>
        <p>Actual vs future predicted prices</p>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <input type="text" value="GOOGL" disabled>

        <select id="modelSelect">
            <option value="linear">Linear Regression</option>
            <option value="lstm">LSTM</option>
        </select>

        <button onclick="predict()">Predict</button>
    </div>

    <!-- RESULT -->
    <div id="result" class="result">
        Prediction will appear here
    </div>

    <!-- CHART -->
    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>

<script>
let chart;

async function predict() {
    const model = document.getElementById("modelSelect").value;

    const historyRes = await fetch("/history");
    const historyData = await historyRes.json();

    const predictRes = await fetch(`/predict/${model}`);
    const predictData = await predictRes.json();

    const actualPrices = historyData.prices;
    const dates = historyData.dates;

    const futurePrices = predictData.future_prices.slice(0, 60);

    const futureDates = [];
    for (let i = 1; i <= futurePrices.length; i++) {
        futureDates.push("Future +" + i);
    }

    document.getElementById("result").innerText =
        `Predicted close price (${model.toUpperCase()}): ${futurePrices[futurePrices.length - 1].toFixed(2)}`;

    drawChart(dates, actualPrices, futureDates, futurePrices, model);
}

function drawChart(dates, actual, futureDates, future, model) {
    const ctx = document.getElementById("priceChart").getContext("2d");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: dates.concat(futureDates),
            datasets: [
                {
                    label: "Actual Close Price",
                    data: actual,
                    borderColor: "#1f4037",
                    borderWidth: 2,
                    fill: false
                },
                {
                    label: `Predicted Close Price (${model.toUpperCase()})`,
                    data: new Array(actual.length).fill(null).concat(future),
                    borderColor: "#7bed9f",
                    borderWidth: 2,
                    borderDash: [5,5],
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    ticks: { maxTicksLimit: 10 }
                }
            }
        }
    });
}
</script>

</body>
</html>
